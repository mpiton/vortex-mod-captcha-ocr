[package]
name = "vortex-mod-captcha-ocr"
version = "1.0.0"
edition = "2021"
description = "Tesseract OCR CAPTCHA solver plugin for Vortex"
license = "GPL-3.0"
authors = ["vortex-community"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
extism = "=1.30.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
